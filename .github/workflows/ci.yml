name: CI

# Cost-slimmed: a single `verify` job installs deps ONCE and runs lint →
# typecheck → test → build sequentially (was 4 separate jobs each paying a
# full `pnpm install`). Docs-only changes are skipped here — canon/docs are
# validated by the Canon Integrity workflow, which needs no install.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Cancel superseded runs on the same ref (rapid pushes queue N runs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Lint / format / mock-leak ---
      - name: Run linters
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check for mock data leaks (Phase 0 Track 0B)
        run: bash scripts/detect-mock-leaks.sh

      # --- Type check ---
      - name: Run type checking
        run: pnpm typecheck

      # --- Test ---
      - name: Run tests
        run: pnpm test

      # Lane B — enforce the send chokepoint: no provider send path may
      # bypass sendGuardedEmail() (suppression/CAN-SPAM + the 6 governors).
      - name: PR send-chokepoint guardrail (apps/api)
        run: node apps/api/scripts/check-api-send-chokepoint.mjs

      # Phase 0.5 Plan 06d: catch the failure mode that bit Track 0D —
      # typecheck + test pass while the runtime plugin chain crashes at startup.
      - name: API startup smoke test
        working-directory: apps/api
        env:
          NODE_ENV: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          COOKIE_SECRET: test-cookie-secret
        run: |
          node --import tsx src/index.ts > /tmp/api-smoke.log 2>&1 &
          API_PID=$!
          sleep 5
          if ! kill -0 $API_PID 2>/dev/null; then
            echo "::error::API process exited during startup — Track-0D-class failure"
            echo "--- /tmp/api-smoke.log ---"
            cat /tmp/api-smoke.log
            exit 1
          fi
          echo "API still alive after 5s — startup OK"
          kill $API_PID 2>/dev/null || true
          wait $API_PID 2>/dev/null || true

      # --- Build (gated on the checks above passing, same as before) ---
      - name: Build all packages
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7
