name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check for mock data leaks (Phase 0 Track 0B)
        run: bash scripts/detect-mock-leaks.sh

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Phase 0.5 Plan 06d: catch the failure mode that bit Track 0D —
      # typecheck + test pass while runtime plugin chain crashes at startup.
      # Boots apps/api for 5 seconds and fails the build if the process
      # exits. Env vars below are test placeholders that satisfy
      # apiEnvSchema (validators/src/env.ts) without requiring real
      # credentials. See docs/sprints/PHASE-0-5-OBSERVABILITY/06d-render-unblock.md
      - name: API startup smoke test
        working-directory: apps/api
        env:
          NODE_ENV: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          COOKIE_SECRET: test-cookie-secret
        run: |
          node --import tsx src/index.ts > /tmp/api-smoke.log 2>&1 &
          API_PID=$!
          sleep 5
          if ! kill -0 $API_PID 2>/dev/null; then
            echo "::error::API process exited during startup — Track-0D-class failure"
            echo "--- /tmp/api-smoke.log ---"
            cat /tmp/api-smoke.log
            exit 1
          fi
          echo "API still alive after 5s — startup OK"
          kill $API_PID 2>/dev/null || true
          wait $API_PID 2>/dev/null || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7
